# Render Blueprint — one web service serving both the Express/Prisma API and
# the client/ static export (client/lib/api-client.ts calls same-origin
# /api/*; see CLAUDE.md), + a managed Postgres. No separate Vercel deploy.
# Deploy: Render dashboard → New → Blueprint → select this repo (deepak007-star/taggify-invoice).
# Render reads this file, provisions everything below, and asks you to fill in
# the vars marked `sync: false` (secrets it can't generate itself).
services:
  - type: web
    name: invoice-taggify-server
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # --include=dev on both installs: NODE_ENV=production below is exported
    # during the build step too (not just at runtime), which makes a plain
    # `npm install` silently skip devDependencies. server needs its `prisma`
    # devDependency (the migrate/generate CLI); client needs `typescript` —
    # without it, Next can't read tsconfig.json's "paths" alias, so every
    # `@/...` import in the app fails to resolve at build time. Root-caused
    # and reproduced exactly (byte-for-byte) via a clean Linux container
    # build with NODE_ENV=production set, matching the Render deploy logs.
    buildCommand: cd server && npm install --include=dev && npx prisma migrate deploy && cd ../client && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Same-origin in production — server/src/app.js serves client/out and
      # the /api/* routes from the one service, so this is a relative path,
      # not a host. (Local dev keeps client/.env.local pointed at
      # http://localhost:4000/api since `next dev` and the API run as two
      # separate processes there.)
      - key: NEXT_PUBLIC_API_URL
        value: /api
      # DigitalOcean Managed Postgres (blr1) since 24 Sep — the Render free
      # DB (invoice-taggify-db) expired. Set in the Render dashboard, never
      # committed: postgresql://…@…ondigitalocean.com:25060/defaultdb?sslmode=require&connection_limit=5
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Cloudinary — fill in from your Cloudinary dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Apify — fill in with your token
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_IG_ACTOR_ID
        value: apify~instagram-scraper
      - key: APIFY_REEL_ACTOR_ID
        value: data-slayer/instagram-post-details
      # Email 2FA (Resend). Without RESEND_API_KEY every login of a user with a
      # verified email fails with 503 EMAIL_NOT_CONFIGURED in production
      # (server/src/lib/mailer.js) — the login OTP can't be sent.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Taggify <noreply@taggify.in>"
      # Google Sheets — finance export + per-plan sheets (service account),
      # and the OAuth client that creates per-plan spreadsheets.
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_FINANCE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_PLANS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # https://<live domain>/api/integrations/google/callback — must also be
      # listed on the OAuth client in Google Cloud Console.
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # Cron
      - key: ENABLE_CRON
        value: "true"
      - key: INSTAGRAM_RESCRAPE_CRON
        value: "0 */6 * * *"
      - key: INVOICE_AGING_SWEEP_CRON
        value: "0 9 * * *"
      - key: FINANCE_EXPORT_CRON
        value: "0 2 * * *"
      # Daily finance export → GitHub (newTask.md #2). GITHUB_TOKEN needs a
      # fine-grained PAT scoped to just this repo with Contents: Read and
      # write — until it's filled in, finance_export runs on schedule but
      # fails with a clear message in JobRun (see /job-runs), nothing else
      # is affected. Pushes to GITHUB_FINANCE_BRANCH (auto-created if it
      # doesn't exist), not `main` — a daily data-only commit shouldn't
      # trigger this same blueprint's auto-deploy-on-push-to-main.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO_OWNER
        value: deepak007-star
      - key: GITHUB_REPO_NAME
        value: taggify-invoice
      - key: GITHUB_FINANCE_BRANCH
        value: finance-data
      - key: GITHUB_FINANCE_PATH
        value: finance-exports/finance-data.xlsx

# No Render-managed database any more (see DATABASE_URL above).
